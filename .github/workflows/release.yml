name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Marketing version, for example 0.1.1"
        required: true
      release_notes:
        description: "Initial draft release notes. Edit the GitHub release before publishing."
        required: false
        default: ""

permissions:
  contents: read

env:
  APP_NAME: Backpocket
  SCHEME: Backpocket
  PROJECT: Backpocket.xcodeproj
  UPDATES_REPO: LegendarySpy/backpocket-updates

jobs:
  release:
    runs-on: macos-26

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Import Developer ID certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"

          echo "$CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Install provisioning profile
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.MACOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$PROVISIONING_PROFILE_BASE64" ]; then
            echo "::error::Set MACOS_PROVISIONING_PROFILE_BASE64 to a base64-encoded Developer ID provisioning profile for com.backpocket.mac with iCloud enabled."
            exit 1
          fi
          PROFILE_PATH="$HOME/Library/MobileDevice/Provisioning Profiles/Backpocket.provisionprofile"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" "$RUNNER_TEMP/profile.plist")
          echo "PROVISIONING_PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project "$PROJECT" -scheme "$SCHEME" -clonedSourcePackagesDirPath .build/SourcePackages

      - name: Archive app
        env:
          VERSION: ${{ inputs.version }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath ".build/${APP_NAME}.xcarchive" \
            -clonedSourcePackagesDirPath .build/SourcePackages \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            PROVISIONING_PROFILE="$PROVISIONING_PROFILE_UUID" \
            OTHER_CODE_SIGN_FLAGS="--timestamp --deep"

      - name: Notarize and package app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          APP_PATH=".build/${APP_NAME}.xcarchive/Products/Applications/${APP_NAME}.app"
          NOTARY_ZIP=".build/${APP_NAME}-notary.zip"
          FINAL_ZIP=".build/${APP_NAME}.zip"

          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          ditto -c -k --keepParent "$APP_PATH" "$NOTARY_ZIP"
          xcrun notarytool submit "$NOTARY_ZIP" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait \
            --output-format json | tee "$RUNNER_TEMP/notary-submit.json"
          SUBMISSION_ID=$(/usr/bin/python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["id"])' "$RUNNER_TEMP/notary-submit.json")
          STATUS=$(/usr/bin/python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["status"])' "$RUNNER_TEMP/notary-submit.json")
          if [ "$STATUS" != "Accepted" ]; then
            xcrun notarytool log "$SUBMISSION_ID" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --team-id "$APPLE_TEAM_ID"
            exit 1
          fi
          xcrun stapler staple "$APP_PATH"
          ditto -c -k --keepParent "$APP_PATH" "$FINAL_ZIP"

      - name: Create draft GitHub release
        env:
          VERSION: ${{ inputs.version }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          GH_TOKEN: ${{ secrets.UPDATES_REPO_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"

          if [ -n "$RELEASE_NOTES" ]; then
            printf "%s\n" "$RELEASE_NOTES" > "$NOTES_FILE"
          else
            printf "TODO: Add release notes before publishing.\n" > "$NOTES_FILE"
          fi

          gh release create "$TAG" ".build/${APP_NAME}.zip" \
            --repo "$UPDATES_REPO" \
            --title "${APP_NAME} ${VERSION}" \
            --notes-file "$NOTES_FILE" \
            --draft
