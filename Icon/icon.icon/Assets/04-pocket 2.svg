<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="denim" x1="512" y1="440" x2="512" y2="860" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#28529E"/>
      <stop offset="1" stop-color="#17346F"/>
    </linearGradient>
    <clipPath id="pocket-clip">
      <path d="M276 442
               Q512 470 748 442
               C762 440 770 452 768 467
               L733 688
               Q728 722 698 741
               L552 835
               Q512 864 472 835
               L326 741
               Q298 722 293 688
               L256 467
               C254 452 262 440 276 442
               Z"/>
    </clipPath>
  </defs>

  <!-- Classic back-pocket silhouette: gently curved opening, tapered sides,
       rounded corners, soft point at the bottom. -->
  <path d="M276 442
           Q512 470 748 442
           C762 440 770 452 768 467
           L733 688
           Q728 722 698 741
           L552 835
           Q512 864 472 835
           L326 741
           Q298 722 293 688
           L256 467
           C254 452 262 440 276 442
           Z"
        fill="url(#denim)"/>

  <!-- The hem deliberately extends past the pocket and is clipped to the exact
       outer silhouette. This keeps both rounded corners perfectly flush. -->
  <path d="M240 454Q512 486 784 454L778 506Q512 538 246 506Z"
        fill="#3565BD" clip-path="url(#pocket-clip)"/>

  <!-- A single clipped stroke forms the dark opening without overlapping
       polygons or exposed corner seams. -->
  <path d="M258 449Q512 479 766 449"
        fill="none" stroke="#0F2557" stroke-width="18" stroke-linecap="round"
        clip-path="url(#pocket-clip)"/>
</svg>
